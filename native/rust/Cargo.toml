[package]
name = "cadcraft-hmos"
version = "0.19.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "cadcraft_hmos"
crate-type = ["staticlib"]

[dependencies]
cadcraft-ui-egui = { path = "../../cadcraft/crates/ui-egui" }
cadcraft-engine = { path = "../../cadcraft/crates/engine" }
# 文件读写钩子的提供者：DWG(acadrust)/DXF 解码编码、SVG/PNG/PDF。引擎本身 I/O 无关，
# 宿主必须经 `cmd::file::set_io` 注入它，否则「打开/另存」报 "file formats are not available"。
cadcraft-io = { path = "../../cadcraft/crates/io" }
# 与上游 cadcraft 完全一致的 egui 配置（0.37 fork；feature 需合并出 default_fonts / monochrome_emoji_fonts）。
egui = { version = "0.37", default-features = false, features = ["default_fonts", "monochrome_emoji_fonts"] }
egui-wgpu = "0.37"
# GLES/EGL 后端是鸿蒙 NDK 能直接用的那套；丢 gles 鸿蒙就没渲染后端（与 solidcraft/photocraft 同源教训）。
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "gles"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
raw-window-handle = "0.6"
libc = "0.2"
# wgpu 的 `request_adapter`/`request_device` 是 async；鸿蒙没有 tokio，用 pollster 在 worker 线程里阻塞等待。
pollster = "0.3"

# 上游 cadcraft 用 git fork；[patch] 只对 workspace 根生效，本适配层是另一个 workspace，必须重述。
# egui 家族 → storytold/egui fork（本地 path）；craft-* → craft-libs（本地 path）；
# wgpu-hal 用 solidcraft 验证过的、带 GLES uniform-block 修补的 vendored 版（wgpu 同为 30.0.1）。
[patch.crates-io]
egui = { path = "../../vendor/egui/crates/egui" }
epaint = { path = "../../vendor/egui/crates/epaint" }
ecolor = { path = "../../vendor/egui/crates/ecolor" }
emath = { path = "../../vendor/egui/crates/emath" }
epaint_default_fonts = { path = "../../vendor/egui/crates/epaint_default_fonts" }
egui-wgpu = { path = "../../vendor/egui/crates/egui-wgpu" }
egui-winit = { path = "../../vendor/egui/crates/egui-winit" }
egui_glow = { path = "../../vendor/egui/crates/egui_glow" }
egui_extras = { path = "../../vendor/egui/crates/egui_extras" }
egui_kittest = { path = "../../vendor/egui/crates/egui_kittest" }
egui_system_font_provider = { path = "../../vendor/egui/crates/egui_system_font_provider" }
eframe = { path = "../../vendor/egui/crates/eframe" }
egui_demo_lib = { path = "../../vendor/egui/crates/egui_demo_lib" }
egui_inspection = { path = "../../vendor/egui/crates/egui_inspection" }
winit = { path = "../../vendor/winit" }
craft-ui = { path = "../../vendor/craft-libs/crates/ui" }
craft-window = { path = "../../vendor/craft-libs/crates/window" }
craft-pdf = { path = "../../vendor/craft-libs/crates/pdf" }
craft-update = { path = "../../vendor/craft-libs/crates/update" }
craft-docpath = { path = "../../vendor/craft-libs/crates/docpath" }
krilla = { path = "../../vendor/craft-libs/vendor/krilla" }
hayro-syntax = { path = "../../vendor/craft-libs/vendor/hayro-syntax" }
hayro-jbig2 = { path = "../../vendor/craft-libs/vendor/hayro-jbig2" }
wgpu-hal = { path = "../../third_party/wgpu-hal-30.0.1" }

[workspace]
